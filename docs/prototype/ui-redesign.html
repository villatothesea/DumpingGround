<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DumpingGround UI 重新设计 · 原型</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:12px/1.35 "Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;background:#d4d4d8;color:#18181b;display:flex;flex-direction:column;overflow:auto}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}

/* ---------- prototype tools (not part of the app) ---------- */
.tools{flex:none;background:#18181b;color:#e4e4e7;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:8px 14px;font-size:12px;position:sticky;top:0;z-index:1000}
.tools b{color:#fff}
.tools .grp{display:flex;align-items:center;gap:6px}
.tools .tseg{display:inline-flex;border:1px solid #52525b;border-radius:5px;overflow:hidden}
.tools .tseg button{background:none;border:0;color:#a1a1aa;padding:3px 9px}
.tools .tseg button.on{background:#3b82f6;color:#fff}
.tools .tbtn{background:#27272a;border:1px solid #52525b;border-radius:5px;padding:3px 10px;color:#e4e4e7}
.tools .tbtn.on{background:#e11d48;border-color:#e11d48;color:#fff}
.tools label{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.tools .sub{opacity:.45;pointer-events:none}
.tools.mon .sub{opacity:1;pointer-events:auto}
.stage{flex:1;padding:18px;display:flex;justify-content:center;align-items:flex-start}
.stagenote{color:#52525b;font-size:11px;padding:0 18px 14px;text-align:center}

/* ---------- theme tokens (identical to the current MyGo light/dark + system accent) ---------- */
.app{--bg:#ffffff;--surface:#f4f4f5;--hover:#e9e9ec;--pressed:#dddde1;--border:#d9d9de;--text:#18181b;--muted:#71717a;
 --accent:#0078d4;--accent-h:#006abb;--accent-p:#005a9f;--accent-t:#ffffff;--danger:#dc2626;--warn:#d97706;--ok:#16a34a;
 --sel:rgba(0,120,212,.25);--focus:rgba(0,120,212,.55);--scroll:rgba(0,0,0,.32);--shadow:rgba(0,0,0,.18)}
.app[data-theme=dark]{--bg:#18181b;--surface:#27272a;--hover:#323236;--pressed:#3c3c41;--border:#3f3f46;--text:#f4f4f5;--muted:#a1a1aa;
 --accent:#0078d4;--accent-h:#3393dc;--accent-p:#0066b4;--danger:#ef4444;--warn:#f59e0b;--ok:#22c55e;
 --sel:rgba(0,120,212,.4);--focus:rgba(51,147,220,.6);--scroll:rgba(255,255,255,.32);--shadow:rgba(0,0,0,.55)}

/* ---------- app window ---------- */
.app{position:relative;width:1180px;height:760px;flex:none;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;
 border:1px solid #71717a;box-shadow:0 12px 40px rgba(0,0,0,.28);font-size:12px}
.app.fit{width:100%;max-width:none;height:calc(100vh - 120px)}
.app ::-webkit-scrollbar{width:6px;height:6px}
.app ::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:3px}
.app ::-webkit-scrollbar-track{background:transparent}

/* top bar */
.topbar{flex:none;height:40px;display:flex;align-items:center;background:var(--surface);border-bottom:1px solid var(--border);padding-left:12px;gap:4px;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:8px;width:150px;flex:none;font-size:14px;font-weight:700;letter-spacing:.1px}
.logo{width:22px;height:22px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:#fff;flex:none}
.logo svg{width:16px;height:16px}
.gl{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;--cut:#0078d4}
.tabs{display:flex;align-items:stretch;height:40px;flex:none}
.tab{position:relative;display:flex;align-items:center;gap:6px;padding:0 12px;border:0;background:none;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--text);background:var(--hover)}
.tab.on{color:var(--text);font-weight:600}
.tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
.tab .rsv{width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.55}
.app[data-tabs=pill] .tabs{align-items:center;gap:4px;padding-left:4px}
.app[data-tabs=pill] .tab{height:28px;border-radius:6px;padding:0 12px}
.app[data-tabs=pill] .tab.on{background:var(--accent);color:var(--accent-t)}
.app[data-tabs=pill] .tab.on::after{display:none}
.app[data-tabs=pill] .tab.on .rsv{background:#fff}
.app.narrow .brand{width:auto;padding-right:6px}
.app.narrow .brand .ell,.app.narrow .search kbd{flex:none;display:none}
.cnt{font-size:11px;font-weight:400;line-height:16px;height:16px;padding:0 6px;border-radius:8px;background:var(--hover);color:var(--muted);font-variant-numeric:tabular-nums}
.tab.on .cnt{background:var(--sel);color:var(--text)}
.app[data-tabs=pill] .tab.on .cnt{background:rgba(255,255,255,.25);color:#fff}
.meters{display:flex;gap:2px;flex:none;margin-left:8px;padding-left:10px;border-left:1px solid var(--border);height:22px;align-items:center}
.statusbar .meter{height:22px;padding:0 6px}
.selacts{display:flex;align-items:center;gap:6px;flex:0 1 auto;min-width:0;overflow:hidden;margin-left:6px;padding-left:8px;border-left:1px solid var(--border);height:28px}
.selacts:empty{display:none}

.meter{position:relative;display:flex;align-items:center;gap:5px;height:28px;padding:0 7px;border-radius:6px;white-space:nowrap;cursor:default;font-variant-numeric:tabular-nums}
.meter:hover{background:var(--hover)}
.meter .lab{color:var(--muted)}
.meter .ico{display:none;color:var(--muted)}
.meter .ico svg.i{width:14px;height:14px}
.meter b{font-weight:600;display:inline-block;min-width:30px;text-align:right}
.meter.w b{color:var(--warn)}
.meter.d b{color:var(--danger)}
.meter .net{display:inline-flex;gap:8px}
.meter .net span{display:inline-flex;align-items:center;gap:2px;color:var(--muted)}
.meter .net b{min-width:30px;color:var(--text);font-weight:400}
.app.narrow .selacts .btn{font-size:0;width:28px;padding:0;gap:0}
.app.narrow .selacts .pact{display:none}
.pact{width:28px;padding:0}
.app.narrow .meter .lab{display:none}
.app.narrow .meter .ico{display:inline-flex}
.app.narrow .meter{padding:0 5px;gap:4px}
.app.narrow .meters{padding-left:4px;margin-left:2px}
.app.narrow .tab{padding:0 8px}
.app.narrow .search{min-width:96px}
.app.narrow .tbar-note{display:none}
@container (max-width:210px){.search kbd{display:none}}
.tb-fill{flex:1 1 16px;min-width:8px;align-self:stretch}
.search{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;flex:0 1 220px;min-width:110px;color:var(--muted)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--focus)}
.search{container-type:inline-size}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text)}
.search input::placeholder{color:var(--muted)}
.search input:disabled{cursor:not-allowed}
.search.off{opacity:.55}
.search kbd{font:11px/1 inherit;border:1px solid var(--border);border-radius:4px;padding:1px 4px;color:var(--muted)}
.tb-tools{display:flex;gap:2px;margin-left:8px;flex:none}
.iconbtn{width:34px;height:28px;border:0;background:none;border-radius:6px;display:grid;place-items:center;color:var(--text)}
.iconbtn:hover{background:var(--hover)}
.iconbtn:active,.iconbtn.on{background:var(--pressed)}
.iconbtn svg.i{width:16px;height:16px}
.winctl{display:flex;height:40px;flex:none;margin-left:6px}
.winbtn{width:46px;height:40px;border:0;background:none;display:grid;place-items:center;color:var(--text)}
.winbtn:hover{background:var(--hover)}
.winbtn.close:hover{background:#c42b1c;color:#fff}
.winbtn svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:1.1}

/* generic controls */
.btn{height:28px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:6px;white-space:nowrap;flex:none}
.btn:hover{background:var(--hover)}
.btn:active{background:var(--pressed)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-t)}
.btn.primary:hover{background:var(--accent-h)}
.btn.primary:active{background:var(--accent-p)}
.btn.danger{color:var(--danger)}
.btn.sq{width:28px;padding:0}
.btn:disabled,.btn.dis{opacity:.45;pointer-events:none}
.btn.on{background:var(--sel)}
.seg{display:inline-flex;flex:none;gap:2px;height:28px;padding:2px;background:var(--surface);border:1px solid var(--border);border-radius:6px}
.seg button{border:0;background:none;border-radius:4px;padding:0 10px;color:var(--muted)}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--bg);color:var(--text);box-shadow:0 0 0 1px var(--border)}
.field{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--muted);min-width:0}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text)}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--focus)}
.field.dis{opacity:.55}
.splitbtn{display:inline-flex;flex:none}
.splitbtn .btn:first-child{border-radius:6px 0 0 6px}
.splitbtn .btn:last-child{border-radius:0 6px 6px 0;border-left:0;width:26px;padding:0}

/* page frame */
.page{flex:1;min-height:0;display:flex;flex-direction:column}
.toolbar{flex:none;height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;min-width:0}
.statusbar{flex:none;height:26px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 12px;color:var(--muted)}
.statusbar .sp{flex:1}
.selbar{flex:none;height:36px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px;min-width:0}
.selbar .btn{background:var(--bg)}
.selbar .btn:hover{background:var(--hover)}
.selbar .info{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.selbar .info b{font-weight:600}
.pico{width:16px;height:16px;border-radius:4px;flex:none;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff}

/* tables */
.twrap{flex:1;min-height:0;overflow:auto;position:relative}
.thead,.tr{display:grid;align-items:center;height:32px;min-width:100%}
.thead{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--border);color:var(--muted)}
.th{padding:0 12px;height:100%;display:flex;align-items:center;gap:4px;user-select:none;white-space:nowrap;min-width:0}
.th.s{cursor:pointer}
.th.s:hover{color:var(--text);background:var(--surface)}
.th.num,.td.num{justify-content:flex-end;text-align:right}
.tr{cursor:default}
.tr:hover{background:var(--surface)}
.tr.sel{background:var(--hover)}
.td{padding:0 12px;display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.td.num{font-variant-numeric:tabular-nums}
.chev{width:16px;height:16px;display:grid;place-items:center;color:var(--muted);flex:none;border-radius:3px;cursor:pointer}
.chev:hover{background:var(--pressed)}
.chev svg.i{width:12px;height:12px}
.chev.none{visibility:hidden}
.pbar{height:4px;border-radius:2px;background:var(--hover);flex:1;min-width:30px;overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--accent)}

/* details dock */
.details{flex:none;height:var(--dh,210px);display:flex;flex-direction:column;border-top:1px solid var(--border);background:var(--bg);position:relative}
.vsplit{position:absolute;left:0;right:0;top:-3px;height:6px;cursor:row-resize;z-index:5}
.vsplit:hover{background:var(--focus)}
.dtabs{flex:none;height:32px;display:flex;align-items:stretch;padding:0 8px;gap:2px;border-bottom:1px solid var(--border)}
.dtab{position:relative;border:0;background:none;color:var(--muted);padding:0 12px;display:flex;align-items:center;gap:6px}
.dtab:hover{color:var(--text)}
.dtab.on{color:var(--text);font-weight:600}
.dtab.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--accent)}
.dtab .n{color:var(--muted);font-weight:400}
.dbody{flex:1;min-height:0;overflow:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;padding:10px 12px;align-items:center}
.kv .k{color:var(--muted)}
.kv .v{display:flex;align-items:center;gap:6px;min-width:0}
.mono{font-family:Consolas,"Cascadia Mono",monospace;font-size:11.5px}

/* disk page */
.scanbar{flex:none;height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;min-width:0}
.drives{display:flex;gap:6px;flex:0 1 auto;min-width:0;overflow-x:auto}
.drive{display:flex;align-items:center;gap:8px;height:28px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);flex:none}
.drive:hover{background:var(--hover)}
.drive b{font-weight:600}
.drive .mini{width:34px;height:4px;border-radius:2px;background:var(--pressed);overflow:hidden}
.drive .mini i{display:block;height:100%;background:var(--accent)}
.drive.on{border-color:var(--accent);background:var(--sel)}
.drive.dis{opacity:.5;pointer-events:none}
.viewbar{flex:none;height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;border-top:1px solid var(--border);min-width:0}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;flex:1;overflow:hidden}
.crumb{border:0;background:none;padding:2px 6px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.crumb:hover{background:var(--hover)}
.crumb.last{font-weight:600;cursor:default}
.crumb.last:hover{background:none}
.crumbs .sep{color:var(--muted);flex:none;display:grid;place-items:center}
.crumbs .sep svg.i{width:12px;height:12px}
.sizes{color:var(--muted);white-space:nowrap;flex:none}
.sizes b{color:var(--text);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 4px 0 8px;border-radius:12px;background:var(--sel);border:1px solid var(--accent);flex:none}
.chip button{border:0;background:none;width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0}
.chip button:hover{background:var(--pressed)}
.chip svg.i{width:11px;height:11px}
.dsplit{flex:1;min-height:0;display:flex;flex-direction:column;border-top:1px solid var(--border)}
.dtop{flex:1;min-height:80px;display:flex;min-width:0;position:relative}
.dtable{flex:1;min-width:0;display:flex;flex-direction:column}
.extp{flex:none;width:var(--ew,270px);border-left:1px solid var(--border);display:flex;flex-direction:column;position:relative}
.hsplit{position:absolute;top:0;bottom:0;left:-3px;width:6px;cursor:col-resize;z-index:5}
.hsplit:hover{background:var(--focus)}
.maparea{flex:none;height:var(--mh,270px);display:flex;flex-direction:column;border-top:1px solid var(--border);position:relative}
.maphead{flex:none;height:28px;display:flex;align-items:center;gap:10px;padding:0 12px;min-width:0}
.maphead b{font-weight:600}
.canvas{flex:1;min-height:0;position:relative;background:var(--surface);overflow:hidden;margin:0}
.tile{position:absolute;overflow:hidden;color:#fff;font-size:11px;padding:3px 4px;cursor:pointer;border-right:1px solid var(--bg);border-bottom:1px solid var(--bg);line-height:1.2}
.tile:hover{filter:brightness(1.15)}
.tile.sel{outline:2px solid #fff;outline-offset:-3px;z-index:2}
.tile span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;pointer-events:none}
.edot{width:8px;height:8px;border-radius:2px;flex:none}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;border-top:1px solid var(--border)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px 20px;min-width:360px;max-width:520px;width:100%;text-align:left}
.card h3{margin:0 0 4px;font-size:14px}
.big{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:12px 0}
.stats div span{display:block;color:var(--muted);font-size:11px}
.stats div b{font-size:16px;font-variant-numeric:tabular-nums}
.ind{height:4px;border-radius:2px;background:var(--hover);overflow:hidden;position:relative}
.ind::after{content:"";position:absolute;top:0;bottom:0;width:30%;background:var(--accent);border-radius:2px;animation:ind 1.1s ease-in-out infinite}
@keyframes ind{0%{left:-30%}100%{left:100%}}
.ph-ico{width:56px;height:56px;border-radius:14px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;color:var(--muted)}
.ph-ico svg.i{width:26px;height:26px}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-size:11px}

/* popovers / menus / modal */
.pop{position:absolute;top:44px;right:150px;width:290px;background:var(--bg);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px var(--shadow);padding:12px 14px;z-index:60;display:none}
.pop.open{display:block}
.pop h4{margin:0 0 10px;font-size:13px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.prow small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.menu{position:absolute;z-index:90;min-width:180px;background:var(--bg);border:1px solid var(--border);border-radius:6px;box-shadow:0 8px 24px var(--shadow);padding:4px}
.mi{height:28px;display:flex;align-items:center;padding:0 10px;border-radius:4px;white-space:nowrap}
.mi:hover{background:var(--hover)}
.mi.danger{color:var(--danger)}
.mi.dis{opacity:.45;pointer-events:none}
.msep{height:1px;background:var(--border);margin:4px 2px}
.mbg{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{width:380px;background:var(--bg);border:1px solid var(--border);border-radius:8px;box-shadow:0 12px 32px var(--shadow);padding:16px 18px}
.modal h3{margin:0 0 6px;font-size:14px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.btn.solid-danger{background:var(--danger);border-color:transparent;color:#fff}

/* measurement overlay */
.mlayer{position:absolute;inset:0;pointer-events:none;z-index:500;overflow:hidden}
.mlayer *{position:absolute}
.mo{border:1px dashed rgba(225,29,72,.55)}
.mpad{border-style:solid;border-color:rgba(34,197,94,.38)}
.mgap{background:rgba(249,115,22,.45)}
.mb{font:9px/11px Consolas,ui-monospace,monospace;background:#e11d48;color:#fff;padding:0 3px;border-radius:2px;white-space:nowrap}
.mb .fs{color:#fde68a}
.mn{font:9px/9px Consolas,ui-monospace,monospace;color:#14532d;background:rgba(255,255,255,.7);padding:0 1px;border-radius:2px;transform:translate(-50%,-50%)}
.mn.g{color:#7c2d12}
.mhl{border:2px solid #3b82f6;background:rgba(59,130,246,.12)}
.mcard{background:#0f172a;color:#e2e8f0;border-radius:6px;padding:8px 10px;font:11px/1.5 Consolas,ui-monospace,monospace;white-space:pre;box-shadow:0 6px 18px rgba(0,0,0,.4);z-index:5}

/* icon gallery */
.ig{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2100;display:none;align-items:center;justify-content:center}
.ig.open{display:flex}
.ig .box{background:#fff;color:#18181b;width:min(1040px,95vw);max-height:92vh;overflow:auto;border-radius:10px;padding:18px 22px;font-size:13px}
.ig h2{margin:0 0 4px;font-size:17px}
.ig .sub{color:#71717a;margin-bottom:14px}
.ig .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.ig .c{border:1px solid #e4e4e7;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:#fafafa}
.ig .c.on{border-color:#0078d4;box-shadow:0 0 0 2px rgba(0,120,212,.25);background:#fff}
.ig .big{height:84px;display:flex;align-items:center;justify-content:center}
.ig .tile2{width:68px;height:68px;border-radius:17px;background:#0078d4;color:#fff;display:grid;place-items:center}
.ig .tile2 svg{width:44px;height:44px}
.ig .row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px}

function procView(){
  const q=S.proc.query.trim().toLowerCase();
  const byPid=new Map(P.map(p=>[p.pid,p]));
  const match=p=>!q||(p.name+' '+p.path).toLowerCase().includes(q)||String(p.pid)===q;
  const matched=P.filter(match);
  const cmp=(a,b)=>{const k=S.proc.sort.k;let n=k==='name'?a.name.toLowerCase().localeCompare(b.name.toLowerCase()):a[k]-b[k];if(!n)n=a.pid-b.pid;return S.proc.sort.desc?-n:n};
  if(!S.proc.tree)return {rows:matched.slice().sort(cmp).map(p=>({p,depth:0,kids:0})),matched:matched.length};
  const inc=new Set(matched.map(p=>p.pid));
  matched.forEach(p=>{let a=byPid.get(p.ppid),g=0;while(a&&a.pid!==0&&g++<64){inc.add(a.pid);a=byPid.get(a.ppid)}});
  const kids=new Map(),roots=[];
  P.filter(p=>inc.has(p.pid)).forEach(p=>{const par=byPid.get(p.ppid);if(par&&p.ppid!==0&&p.ppid!==p.pid&&inc.has(p.ppid)){(kids.get(p.ppid)||kids.set(p.ppid,[]).get(p.ppid)).push(p)}else roots.push(p)});
  const out=[];
  const walk=(p,d)=>{const ks=(kids.get(p.pid)||[]).sort(cmp);out.push({p,depth:d,kids:ks.length});if(ks.length&&(q||S.proc.open.has(p.pid)))ks.forEach(k=>walk(k,d+1))};
  roots.sort(cmp).forEach(r=>walk(r,0));
  return {rows:out,matched:matched.length};
}

let NODES=[];
function parseTree(){
  NODES=[];let id=0;const root={id:id++,n:'',d:1,kids:[],parent:null};NODES.push(root);const st=[root];
  SPEC.split('\n').forEach(line=>{
    const ind=line.match(/^ */)[0].length/2,t=line.trim(),node={id:id++,kids:[]};
    while(st.length>ind+1)st.pop();const par=st[st.length-1];node.parent=par;
    if(t.endsWith('/')){node.d=1;node.n=t.slice(0,-1);st.push(node)}
    else{const m=t.match(/^(.*) (\d+(?:\.\d+)?)$/);node.n=m[1];node.logical=+m[2]*MB;node.alloc=Math.ceil(node.logical*1.04/4096)*4096}
    par.kids.push(node);NODES.push(node)});
  (function agg(n){if(!n.d){n.files=1;return}n.logical=0;n.alloc=0;n.files=0;n.kids.forEach(k=>{agg(k);n.logical+=k.logical;n.alloc+=k.alloc;n.files+=k.files})})(root);
  return root;
}

  const total=items.reduce((a,b)=>a+b.v,0),out=[];let x=0,y=0,w=W,h=H;
  let rest=items.map(i=>({...i,a:i.v/total*W*H}));
  const worst=(row,s)=>{const sum=row.reduce((a,b)=>a+b.a,0),mx=Math.max(...row.map(r=>r.a)),mn=Math.min(...row.map(r=>r.a));return Math.max(s*s*mx/(sum*sum),sum*sum/(s*s*mn))};
  while(rest.length){const side=Math.min(w,h);let row=[rest[0]],i=1;
    while(i<rest.length){const nr=row.concat(rest[i]);if(worst(nr,side)<=worst(row,side)){row=nr;i++}else break}
    const s=row.reduce((a,b)=>a+b.a,0);
    if(w>=h){const rw=s/h;let cy=y;row.forEach(r=>{const rh=r.a/rw;out.push({n:r.n,x,y:cy,w:rw,h:rh});cy+=rh});x+=rw;w-=rw}

    rest=rest.slice(row.length)}

      const cand=[[x,y],[x+w-bw,y],[x,y+h-bh],[x+w-bw,y+h-bh],[x+(w-bw)/2,y+(h-bh)/2]];
      const ok=c=>!placed.some(p=>c[0]<p[0]+p[2]&&c[0]+bw>p[0]&&c[1]<p[1]+p[3]&&c[1]+bh>p[1]);
      let pos=cand.find(ok);if(!pos&&h>40)pos=[x+2,y+13];if(!pos)return;
      placed.push([pos[0],pos[1],bw,bh]);
      const b=document.createElement('div');b.className='mb';b.innerHTML=t+fs;b.style.left=pos[0]+'px';b.style.top=pos[1]+'px';L.appendChild(b)}
  });
}
app.addEventListener('mousemove',e=>{
  if(!M.on||!M.hover)return;
  const L=$('#mlayer');$$('#mlayer .mhl,#mlayer .mcard').forEach(n=>n.remove());
  const el=e.target.closest('.app *');if(!el||el.closest('.mlayer'))return;
  const ar=app.getBoundingClientRect(),r=el.getBoundingClientRect(),cs=getComputedStyle(el);
  addEl(L,'mhl',r.left-ar.left,r.top-ar.top,r.width,r.height);
  const c=document.createElement('div');c.className='mcard';
  const pad=[cs.paddingTop,cs.paddingRight,cs.paddingBottom,cs.paddingLeft].map(px).join(' ');
  c.textContent=`${el.tagName.toLowerCase()}${el.className&&typeof el.className==='string'?'.'+el.className.trim().split(/\s+/).join('.'):''}\n尺寸    ${Math.round(r.width*10)/10} × ${Math.round(r.height*10)/10}\n内边距  ${pad}\n间隙    ${px(cs.columnGap)||0}\n字号    ${px(cs.fontSize)}px / ${cs.fontWeight}\n圆角    ${px(cs.borderTopLeftRadius)||0}`;
  L.appendChild(c);
  c.style.left=Math.min(e.clientX-ar.left+14,ar.width-240)+'px';c.style.top=Math.min(e.clientY-ar.top+14,ar.height-110)+'px';
});

(function init(){
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('theme')==='dark')S.theme='dark';
  if(h.get('tabs'))app.dataset.tabs=h.get('tabs');
  if(h.get('size')==='880'){app.style.width='880px';app.style.height='580px'}
  syncSettings();renderTheme();$('#btnSettings').innerHTML=ic('gear');
  if(h.get('tab'))S.tab=h.get('tab');
  if(h.get('state')==='done'||h.get('state')==='idle'){S.disk.state=h.get('state');if(h.get('state')==='done')S.disk.root=TREE}
  if(h.get('tree')==='1'){S.proc.tree=true;P.forEach(p=>S.proc.open.add(p.pid))}
  if(h.get('sel')){S.proc.sel=+h.get('sel')}
  if(h.get('details')==='1')S.proc.details=true;
  if(h.get('dtab'))S.proc.dtab=h.get('dtab');
  renderTabs();renderMeters();renderPage();updateSearch();renderStatus();
  if(h.get('state')==='scanning'){S.tab='disk';renderTabs();startScan()}
  if(h.get('settings')==='1'){$('#popSettings').classList.add('open');$('#btnSettings').classList.add('on')}
  if(h.get('menu')==='kill'){const b=$('[data-act=killmenu]');if(b)b.click()}
  if(h.get('measure')==='1'){M.on=true;$('#tMeasure').classList.add('on');$('#tMeasure').textContent='数值标注：开';$('#tools').classList.add('mon')}
  if(h.get('mhover')==='1'){M.hover=true;$('#mHover').checked=true}
  if(h.get('changes')==='1')$('#cl').classList.add('open');
  if(h.get('hot')){HOT=true;SYS.cpu=93;SYS.mem=80;SYS.disk=45;renderMeters()}
  if(h.get('logo'))applyLogo(+h.get('logo'));
  if(h.get('icons')==='1'){renderLogoGallery();$('#ig').classList.add('open')}
  syncTools();scheduleMeasure();
  window.addEventListener('resize',renderMap);
})();
</script>
